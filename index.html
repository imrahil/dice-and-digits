<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14111d" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Score keeper for board games — rounds, score sheets, history and stats. Works offline. English &amp; Polish." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Dice &amp; Digits" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.json" />
    <title>Dice &amp; Digits</title>
    <script>
      // Apply the saved (or system) theme and language before first paint.
      // Keep in sync with src/hooks/useTheme.ts and the settings key in src/lib/store.ts.
      ;(function () {
        var s = {}
        try { s = JSON.parse(localStorage.getItem('dice-digits:settings') || '{}') } catch (e) {}
        var t = s.theme
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        if (s.lang) document.documentElement.lang = s.lang
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
