<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f0ebff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0b17" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Score keeper for board games — rounds, score sheets, history and stats. Works offline. English &amp; Polish." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Dice &amp; Digits" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.json" />
    <title>Dice &amp; Digits</title>
    <script>
      // Routes live in the hash. Offline, the service worker answers any
      // navigation in its scope with this page, so a path deep link (/live/ABC)
      // lands here with relative asset URLs that would point one folder too
      // deep. Move it to the hash form under the app root (where sw.js
      // lives). Online without a service worker, public/404.html does the
      // same. Keep the two in sync.
      ;(function () {
        var sw = navigator.serviceWorker && navigator.serviceWorker.controller
        if (!sw) return
        var l = window.location
        var root = new URL('./', sw.scriptURL).pathname
        if (l.pathname === root || l.pathname === root + 'index.html' || l.pathname.indexOf(root) !== 0) return
        var rest = l.pathname.slice(root.length).replace(/\/+$/, '')
        l.replace(root + l.search + (l.hash || '#/' + rest))
      })()
    </script>
    <script>
      // Apply the saved (or system) theme, skin and language before first paint.
      // Keep in sync with src/hooks/useTheme.ts and the settings key in src/lib/store.ts.
      ;(function () {
        var s = {}
        try { s = JSON.parse(localStorage.getItem('dice-digits:settings') || '{}') } catch (e) {}
        var t = s.theme
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.dataset.skin = s.skin || 'arcade'
        if (s.lang) document.documentElement.lang = s.lang
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
